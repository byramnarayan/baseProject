{% extends "base.html" %}
{% block content %}
  <!-- Error Article Container -->
  <article class="bg-white border border-brand rounded-none py-12 px-8 mb-4 text-center">

    <!-- Error Title Header -->
    <h1 class="text-6xl font-bold font-heading mb-4 text-navy">
      {{ status_code }}
    </h1>
    <h2 class="text-2xl font-bold font-heading mb-6 text-ink uppercase tracking-wider">
      An Error Occurred
    </h2>

    <!-- Error Description Message -->
    <p class="text-muted-grey leading-relaxed max-w-md mx-auto mb-8">{{ message }}</p>
    
    <a href="{{ url_for('home') }}" class="inline-block bg-navy text-white hover:bg-gold hover:text-navy px-6 py-3 rounded-none font-bold text-sm tracking-wide transition-colors">
      RETURN HOME
    </a>

  </article>
{% endblock content %}

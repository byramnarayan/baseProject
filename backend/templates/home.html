{% extends "base.html" %}
{% block content %}
  {% for post in posts %}
    <article class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm py-4 px-5 mb-4">
        <div class="flex items-start gap-4">
        <!-- Profile Image -->
        <!-- The p-1 and border classes replicate the .article-img styling -->
        <img class="rounded-full shrink-0 border border-gray-200 dark:border-gray-600 p-1 bg-white dark:bg-gray-700 object-cover"
            src="{{post.author.image_path}}"
            alt="{{ post.author.username }}'s profile picture"
            width="64"
            height="64"
            loading="lazy">

        <!-- Article Content -->
        <div class="grow">
            <!-- Metadata with bottom border replication -->
            <div class="border-b border-gray-200 dark:border-gray-700 pb-1 mb-2">
            <a class="mr-2 font-medium text-steel hover:underline" href="{{url_for("user_posts", user_id=post.author.id)}}">{{ post.author.username  }}</a>
            <small class="text-sm text-gray-500 dark:text-gray-400">{{ post.date_posted.strftime('%B %d, %Y') }}</small>
            </div>

            <!-- Title -->
            <h2 class="text-2xl mt-1 mb-2">
            <a class="font-bold text-gray-900 dark:text-white hover:text-steel transition-colors" href="{{ url_for("post_page", post_id=post.id)}}">{{ post.title }}</a>
            </h2>

            <!-- Content -->
            <p class="text-gray-700 dark:text-gray-300 leading-relaxed">{{ post.content }}</p>
        </div>
        </div>
    </article>
  {% endfor %}
{% endblock content %}

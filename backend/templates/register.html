{% extends "base.html" %}
{% block content %}
  <div class="max-w-md mx-auto bg-white border border-brand p-8 mt-8">
    <h2 class="text-3xl font-bold font-heading mb-6 text-ink border-b border-brand pb-4">Register</h2>
    <form id="registerForm" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-bold uppercase tracking-wider mb-2 text-ink">Username</label>
        <input type="text"
               class="w-full border border-brand px-4 py-2 focus:outline-none focus:border-ink bg-white"
               id="username"
               name="username"
               required
               minlength="1"
               maxlength="50">
      </div>
      <div>
        <label for="email" class="block text-sm font-bold uppercase tracking-wider mb-2 text-ink">Email</label>
        <input type="email" 
               class="w-full border border-brand px-4 py-2 focus:outline-none focus:border-ink bg-white" 
               id="email" 
               name="email" 
               required>
      </div>
      <div>
        <label for="password" class="block text-sm font-bold uppercase tracking-wider mb-2 text-ink">Password</label>
        <input type="password"
               class="w-full border border-brand px-4 py-2 focus:outline-none focus:border-ink bg-white"
               id="password"
               name="password"
               required
               minlength="8">
        <p class="text-xs text-muted-grey mt-1">Must be at least 8 characters.</p>
      </div>
      <div>
        <label for="confirmPassword" class="block text-sm font-bold uppercase tracking-wider mb-2 text-ink">Confirm Password</label>
        <input type="password"
               class="w-full border border-brand px-4 py-2 focus:outline-none focus:border-ink bg-white"
               id="confirmPassword"
               name="confirmPassword"
               required
               minlength="8">
        <div id="passwordError" class="text-xs text-red-600 font-bold mt-1 hidden">Passwords do not match.</div>
      </div>
      <div class="pt-4">
        <button type="submit" class="w-full px-5 py-3 text-sm font-bold uppercase tracking-wider border border-navy text-white bg-navy hover:bg-ink transition-colors">Register</button>
      </div>
    </form>
    <p class="mt-6 text-sm text-center text-muted-grey">
        Already have an account? <a href="{{ url_for('login_page') }}" class="font-bold text-navy hover:text-gold transition-colors">Login here</a>
    </p>
  </div>
{% endblock content %}

{% block scripts %}
  <script type="module">
    // Import utility functions to handle error messages and trigger the native dialog modals
    import { getErrorMessage, showModal } from '/static/js/utils.js';

    // Grab references to all the necessary DOM elements
    const registerForm = document.getElementById('registerForm');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const passwordError = document.getElementById('passwordError');

    // -------------------------------------------------------------------------
    // Real-time Password Validation
    // This function runs every time the user types in the confirm password field.
    // It checks if the passwords match and shows/hides the error message dynamically.
    // -------------------------------------------------------------------------
    confirmPasswordInput.addEventListener('input', () => {
      if (passwordInput.value !== confirmPasswordInput.value) {
        // Passwords don't match: show error by removing the Tailwind 'hidden' class
        passwordError.classList.remove('hidden');
        // setCustomValidity prevents the HTML form from submitting automatically
        confirmPasswordInput.setCustomValidity('Passwords do not match');
      } else {
        // Passwords match: hide error by adding the Tailwind 'hidden' class
        passwordError.classList.add('hidden');
        // Clear the custom validity so the form can submit
        confirmPasswordInput.setCustomValidity('');
      }
    });

    // -------------------------------------------------------------------------
    // Form Submission Handler
    // This intercepts the form submission to send the data via a fetch API call
    // instead of a standard page reload.
    // -------------------------------------------------------------------------
    registerForm.addEventListener('submit', async (event) => {
      // Prevent the default browser form submission
      event.preventDefault();

      // Double-check passwords match before sending to server
      if (passwordInput.value !== confirmPasswordInput.value) {
        passwordError.classList.remove('hidden');
        return;
      }

      // Extract all input values from the form
      const formData = new FormData(registerForm);
      const userData = {
        username: formData.get('username'),
        email: formData.get('email'),
        password: formData.get('password'),
      };

      try {
        // Send a POST request to our FastAPI backend to create the user
        const response = await fetch('/api/users', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(userData),
        });

        if (response.ok) {
          // Success: Update the success modal message (modal is defined in base.html)
          document.getElementById('successMessage').textContent = 'Account created successfully! Please login.';
          
          // Show the success modal
          showModal('successModal');

          // Listen for the native dialog 'close' event (replaces Bootstrap's hidden.bs.modal)
          // When the user closes the success message, redirect them to the login page
          document.getElementById('successModal').addEventListener('close', () => {
            window.location.href = '/login';
          }, { once: true });
          
        } else {
          // Error: The server rejected the request (e.g. username taken)
          const error = await response.json();
          document.getElementById('errorMessage').textContent = getErrorMessage(error);
          showModal('errorModal'); // Show error modal defined in base.html
        }
      } catch (error) {
        // Network Error: The server is unreachable
        document.getElementById('errorMessage').textContent = 'Network error. Please check your connection and try again.';
        showModal('errorModal');
      }
    });
  </script>
{% endblock scripts %}

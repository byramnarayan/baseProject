{% extends "base.html" %}
{% block content %}
  <div class="max-w-md mx-auto bg-white border border-brand p-8 mt-8">
    <h2 class="text-3xl font-bold font-heading mb-6 text-ink border-b border-brand pb-4">Login</h2>
    <form id="loginForm" class="space-y-4">
      <div>
        <!-- 
          Note: FastAPI's OAuth2PasswordRequestForm expects a field named 'username'.
          Even if users log in with an email, the input name must be 'username' 
          unless you configured OAuth2 differently in the backend.
        -->
        <label for="username" class="block text-sm font-bold uppercase tracking-wider mb-2 text-ink">Username</label>
        <input type="text"
               class="w-full border border-brand px-4 py-2 focus:outline-none focus:border-ink bg-white"
               id="username"
               name="username"
               required>
      </div>
      <div>
        <label for="password" class="block text-sm font-bold uppercase tracking-wider mb-2 text-ink">Password</label>
        <input type="password"
               class="w-full border border-brand px-4 py-2 focus:outline-none focus:border-ink bg-white"
               id="password"
               name="password"
               required>
      </div>
      <div class="pt-4">
        <button type="submit" class="w-full px-5 py-3 text-sm font-bold uppercase tracking-wider border border-navy text-white bg-navy hover:bg-ink transition-colors">Login</button>
      </div>
    </form>
    <div class="mt-6 text-sm text-center text-muted-grey space-y-2">
      <p>
        <a href="{{ url_for('forgot_password_page') }}" class="font-bold text-navy hover:text-gold transition-colors">Forgot your password?</a>
      </p>
      <p>
        Don't have an account? <a href="{{ url_for('register_page') }}" class="font-bold text-navy hover:text-gold transition-colors">Register here</a>
      </p>
    </div>
  </div>
{% endblock content %}

{% block scripts %}
  <script type="module">
    // Import utility functions to handle error messages and trigger the native dialog modals
    import { getErrorMessage, showModal } from '/static/js/utils.js';

    // Grab reference to the login form
    const loginForm = document.getElementById('loginForm');

    // -------------------------------------------------------------------------
    // Form Submission Handler
    // This intercepts the form submission to send the data via a fetch API call
    // instead of a standard page reload.
    // -------------------------------------------------------------------------
    loginForm.addEventListener('submit', async (event) => {
      // Prevent the default browser form submission
      event.preventDefault();

      // Extract all input values from the form
      const formData = new FormData(loginForm);
      
      // CRITICAL: FastAPI's OAuth2PasswordRequestForm expects standard form-urlencoded data,
      // NOT a JSON string. So we convert our FormData into URLSearchParams.
      const urlEncodedData = new URLSearchParams(formData);

      try {
        // Send a POST request to our FastAPI backend to get the auth token
        const response = await fetch('/api/users/token', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: urlEncodedData,
        });

        if (response.ok) {
          // Success: parse the token and save it to localStorage so subsequent API calls can use it
          const data = await response.json();
          localStorage.setItem('access_token', data.access_token);
          
          // Update the success modal message (modal is defined in base.html)
          document.getElementById('successMessage').textContent = 'Logged in successfully!';
          
          // Show the success modal
          showModal('successModal');

          // Listen for the native dialog 'close' event (replaces Bootstrap's hidden.bs.modal)
          // When the user closes the success message, redirect them to the home page
          document.getElementById('successModal').addEventListener('close', () => {
            window.location.href = '/';
          }, { once: true });
          
        } else {
          // Error: The server rejected the login (e.g. incorrect password)
          const error = await response.json();
          document.getElementById('errorMessage').textContent = getErrorMessage(error);
          showModal('errorModal'); // Show error modal defined in base.html
        }
      } catch (error) {
        // Network Error: The server is unreachable
        document.getElementById('errorMessage').textContent = 'Network error. Please check your connection and try again.';
        showModal('errorModal');
      }
    });
  </script>
{% endblock scripts %}

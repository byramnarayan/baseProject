{% extends "base.html" %}
{% block content %}
  <!-- Article Container -->
  <article class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm py-3 px-4 mb-4">
    <div class="flex items-start gap-4">

      <!-- Profile Image -->
      <img class="rounded-full shrink-0 border border-gray-200 dark:border-gray-600 p-1 bg-white dark:bg-gray-700 object-cover"
           src="{{post.author.image_path }}"
           alt="{{ post.author.username }}'s profile picture"
           width="64"
           height="64"
           loading="lazy">

      <!-- Main Column Content -->
      <div class="grow">

        <!-- Metadata -->
        <div class="border-b border-gray-200 dark:border-gray-700 pb-1 mb-2">
          <a class="mr-2 font-semibold text-steel hover:underline" href="#">{{ post.author.username }}</a>
          <small class="text-sm text-gray-500 dark:text-gray-400">{{ post.date_posted.strftime('%B %d, %Y') }}</small>
        </div>

        <!-- Post Title & Content -->
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">{{ post.title }}</h2>
        <p class="text-gray-700 dark:text-gray-300 leading-relaxed mb-4">{{ post.content }}</p>

        <!-- Only show edit/delete options if the user is the author -->
        <!-- TODO: Add user authentication and authorization -->
        <div class="mt-3 pt-3 border-t border-gray-200 dark:border-gray-700 flex gap-2">

          <!-- Edit Post Button -->
          <a class="inline-block px-4 py-1.5 text-sm font-medium border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded hover:bg-gray-50 dark:hover:bg-gray-700 transition"
             href="#">
            Edit Post
          </a>

          <!-- Delete Trigger Button -->
          <button type="button"
                  onclick="document.getElementById('deleteModal').showModal()"
                  class="inline-block px-4 py-1.5 text-sm font-medium border border-red-500 text-red-500 rounded hover:bg-red-500 hover:text-white transition">
            Delete Post
          </button>

        </div>
        <!-- TODO: Add user authentication and authorization -->

      </div>
    </div>
  </article>

  <!-- Delete Confirmation Modal (Native HTML Dialog) -->
  <dialog id="deleteModal"
          class="backdrop:bg-black/50 backdrop:backdrop-blur-sm rounded-lg shadow-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 p-0 w-full max-w-md text-gray-900 dark:text-white">

    <!-- Modal Header -->
    <div class="flex justify-between items-center px-6 py-4 border-b border-gray-200 dark:border-gray-700">
      <h5 class="text-lg font-bold">Delete Post?</h5>
      <button type="button"
              onclick="document.getElementById('deleteModal').close()"
              class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 focus:outline-none text-xl font-semibold">
        &times;
      </button>
    </div>

    <!-- Modal Body & Form -->
    <!-- TODO: <form action="#" method="post"> -->
    <form action="#" class="m-0">
      <div class="px-6 py-4 text-gray-600 dark:text-gray-300">
        Are you sure you want to delete this post? This action cannot be undone.
      </div>

      <!-- Modal Footer -->
      <div class="flex justify-end gap-2 px-6 py-3 bg-gray-50 dark:bg-gray-800/50 border-t border-gray-200 dark:border-gray-700 rounded-b-lg">
        <button type="button"
                onclick="document.getElementById('deleteModal').close()"
                class="px-4 py-2 text-sm font-medium border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition">
          Cancel
        </button>
        <button type="submit"
                class="px-4 py-2 text-sm font-medium border border-red-500 text-red-500 rounded hover:bg-red-500 hover:text-white transition">
          Delete
        </button>
      </div>
    </form>

  </dialog>
{% endblock content %}

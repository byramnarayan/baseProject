{% extends "base.html" %}
{% block content %}
  <!-- Page Header -->
  <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-4">
    Posts by {{ user.username }}
  </h1>

  {% for post in posts %}
    <!-- Individual Post Card -->
    <article class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm py-3 px-4 mb-4">
      <div class="flex items-start gap-4">
        
        <!-- Profile Image -->
        <img class="rounded-full shrink-0 border border-gray-200 dark:border-gray-600 p-1 bg-white dark:bg-gray-700 object-cover"
             src="{{ post.author.image_path }}"
             alt="{{ post.author.username }}'s profile picture"
             width="64"
             height="64"
             loading="lazy">
        
        <!-- Main Content Area -->
        <div class="grow">
          
          <!-- Metadata Section -->
          <div class="border-b border-gray-200 dark:border-gray-700 pb-1 mb-2">
            <a class="mr-2 font-semibold text-steel hover:underline"
               href="{{ url_for('user_posts', user_id=post.author.id) }}">
              {{ post.author.username }}
            </a>
            <small class="text-sm text-gray-500 dark:text-gray-400">
              {{ post.date_posted.strftime("%B %d, %Y") }}
            </small>
          </div>
          
          <!-- Post Title Link -->
          <h2>
            <a class="text-2xl font-bold text-gray-900 dark:text-white hover:text-steel transition-colors"
               href="{{ url_for('post_page', post_id=post.id) }}">
              {{ post.title }}
            </a>
          </h2>
          
          <!-- Post Snippet -->
          <p class="text-gray-700 dark:text-gray-300 leading-relaxed mt-1">
            {{ post.content }}
          </p>
          
        </div>
      </div>
    </article>
  {% else %}
    <!-- Empty State Text -->
    <p class="text-gray-500 dark:text-gray-400 italic">No posts by this user yet.</p>
  {% endfor %}
{% endblock content %}

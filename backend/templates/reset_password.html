{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white border border-brand p-8 mt-8">
  <h2 class="text-3xl font-bold font-heading mb-4 text-ink border-b border-brand pb-4">Reset Password</h2>
  <p class="text-muted-grey text-sm mb-6">Enter your new password below.</p>
  <form id="resetPasswordForm" class="space-y-4">
    <div>
      <label for="newPassword" class="block text-sm font-bold uppercase tracking-wider mb-2 text-ink">New Password</label>
      <input type="password"
             class="w-full border border-brand px-4 py-2 focus:outline-none focus:border-ink bg-white"
             id="newPassword"
             name="new_password"
             required
             minlength="8"
             autofocus>
      <p class="text-xs text-muted-grey mt-1">Password must be at least 8 characters.</p>
    </div>
    <div>
      <label for="confirmPassword" class="block text-sm font-bold uppercase tracking-wider mb-2 text-ink">Confirm New Password</label>
      <input type="password"
             class="w-full border border-brand px-4 py-2 focus:outline-none focus:border-ink bg-white"
             id="confirmPassword"
             name="confirm_password"
             required
             minlength="8">
    </div>
    <div class="pt-4">
      <button type="submit" class="w-full px-5 py-3 text-sm font-bold uppercase tracking-wider border border-navy text-white bg-navy hover:bg-ink transition-colors" id="submitBtn">Reset Password</button>
    </div>
  </form>
  <p class="mt-6 text-sm text-center text-muted-grey">
    Remember your password? <a href="{{ url_for('login_page') }}" class="font-bold text-navy hover:text-gold transition-colors">Login here</a>
  </p>
</div>
{% endblock content %}

{% block scripts %}
<script type="module">
  import { getErrorMessage, showModal } from '/static/js/utils.js';

  /**
   * STEP 1: Extract the secret token from the URL query parameters.
   * e.g., if the URL is /reset-password?token=XYZ123
   * token will be 'XYZ123'
   */
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');

  // If there's no token in the URL, the link is invalid, so we block the form.
  if (!token) {
    document.getElementById('errorMessage').textContent =
      'Invalid or missing reset token. Please request a new password reset.';
    showModal('errorModal');
    document.getElementById('submitBtn').disabled = true;
  }

  const resetPasswordForm = document.getElementById('resetPasswordForm');
  const submitBtn = document.getElementById('submitBtn');

  /**
   * STEP 2: Handle the form submission to set the new password.
   */
  resetPasswordForm.addEventListener('submit', async (event) => {
    event.preventDefault();

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    // Client-side validation: Ensure the passwords match before bothering the server
    if (newPassword !== confirmPassword) {
      document.getElementById('errorMessage').textContent = 'Passwords do not match.';
      showModal('errorModal');
      return;
    }

    // Disable button to prevent multi-submit
    submitBtn.disabled = true;
    submitBtn.textContent = 'RESETTING...';

    try {
      // Send the token AND the new password to the backend
      const response = await fetch('/api/users/reset-password', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          token: token,
          new_password: newPassword,
        }),
      });

      if (response.ok) {
        // Success! Password changed.
        document.getElementById('successMessage').textContent =
          'Password reset successfully! You can now log in with your new password.';
        showModal('successModal');

        // Redirect to login page AFTER the user closes the success dialog
        document.getElementById('successModal').addEventListener('close', () => {
          window.location.href = '/login';
        }, { once: true });
      } else {
        // Backend rejected the token (expired or invalid) or password
        const error = await response.json();
        let errorText = getErrorMessage(error);
        
        // If it's a 400 Bad Request, the token is likely dead, prompt for a new one
        if (response.status === 400) {
          errorText += ' Please request a new password reset.';
        }
        
        document.getElementById('errorMessage').textContent = errorText;
        showModal('errorModal');
      }
    } catch (error) {
      document.getElementById('errorMessage').textContent =
        'Network error. Please check your connection and try again.';
      showModal('errorModal');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'RESET PASSWORD';
    }
  });
</script>
{% endblock scripts %}

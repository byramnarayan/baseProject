{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white border border-brand p-8 mt-8">
  <h2 class="text-3xl font-bold font-heading mb-4 text-ink border-b border-brand pb-4">Forgot Password</h2>
  <p class="text-muted-grey text-sm mb-6">Enter your email address and we'll send you a link to reset your password.</p>
  <form id="forgotPasswordForm" class="space-y-4">
    <div>
      <label for="email" class="block text-sm font-bold uppercase tracking-wider mb-2 text-ink">Email</label>
      <input type="email" 
             class="w-full border border-brand px-4 py-2 focus:outline-none focus:border-ink bg-white" 
             id="email" 
             name="email" 
             required 
             autofocus>
    </div>
    <div class="pt-4">
      <button type="submit" class="w-full px-5 py-3 text-sm font-bold uppercase tracking-wider border border-navy text-white bg-navy hover:bg-ink transition-colors" id="submitBtn">Send Reset Link</button>
    </div>
  </form>
  <p class="mt-6 text-sm text-center text-muted-grey">
    Remember your password? <a href="{{ url_for('login_page') }}" class="font-bold text-navy hover:text-gold transition-colors">Login here</a>
  </p>
</div>
{% endblock content %}

{% block scripts %}
<script type="module">
  // Import utility functions to handle UI modals
  import { getErrorMessage, showModal } from '/static/js/utils.js';

  const forgotPasswordForm = document.getElementById('forgotPasswordForm');
  const submitBtn = document.getElementById('submitBtn');

  /**
   * Handles the forgot password form submission.
   * 
   * How it works:
   * 1. Extracts the email from the form.
   * 2. Sends it as JSON to our FastAPI backend.
   * 3. Always shows a success message (to prevent email enumeration).
   */
  forgotPasswordForm.addEventListener('submit', async (event) => {
    event.preventDefault();

    // Disable button during submission to prevent double-clicks
    submitBtn.disabled = true;
    submitBtn.textContent = 'SENDING...';

    // Extract form data into a neat JS object
    const formData = new FormData(forgotPasswordForm);
    const data = Object.fromEntries(formData.entries());

    try {
      // Send POST request with JSON payload
      const response = await fetch('/api/users/forgot-password', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(data),
      });

      // Always show success message (even if email doesn't exist - security best practice)
      if (response.status === 202) {
        document.getElementById('successMessage').textContent =
          'If an account exists with this email, you will receive password reset instructions shortly.';
        showModal('successModal');

        // Clear the form input
        forgotPasswordForm.reset();
      } else {
        // Handle unexpected errors (e.g., rate limits, bad inputs)
        const error = await response.json();
        document.getElementById('errorMessage').textContent = getErrorMessage(error);
        showModal('errorModal');
      }
    } catch (error) {
      document.getElementById('errorMessage').textContent =
        'Network error. Please check your connection and try again.';
      showModal('errorModal');
    } finally {
      // Re-enable button after request is complete
      submitBtn.disabled = false;
      submitBtn.textContent = 'SEND RESET LINK';
    }
  });
</script>
{% endblock scripts %}
